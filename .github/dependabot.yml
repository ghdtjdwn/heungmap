version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # typescript-eslint(eslint-config-next 경유)가 TypeScript 7을 아직 지원하지 않는다 (#85)
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    groups:
      # @types/react-dom은 같은 minor의 @types/react를 peer로 요구하므로 react 계열은 한 PR로 묶는다
      react:
        patterns:
          - react
          - react-dom
          - "@types/react"
          - "@types/react-dom"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
