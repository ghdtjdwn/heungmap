name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
            backend/requirements-model.txt
      - name: Install dependencies
        run: pip install -r backend/requirements-dev.txt -r backend/requirements-model.txt
      - name: Run tests
        env:
          PYTHONPATH: backend
        run: python -m pytest backend/tests -q

  frontend:
    name: frontend typecheck · lint · build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - name: Build
        env:
          HEUNGMAP_SKIP_ROOT_ENV: "true"
          KAKAO_JAVASCRIPT_KEY: ci-dummy
        run: npm run build
